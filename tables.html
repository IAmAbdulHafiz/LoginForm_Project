<!DOCTYPE html>
<html>
    <head>
        <title>Tables</title>
        <link rel="stylesheet" href="tstyle.css">
    </head>
    <body>
        <div class="table-container">
            <table class="custom-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Student Name</th>
                        <th>Admission No.</th>
                        <th>Class</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Abdul Rahman</td>
                        <td>ADM001</td>
                        <td>Basic 3</td>
                        <td>
                            <span class="badge approved">Approved</span>
                        </td>
                        <td>
                            <button class="btn-view">View</button>
                        </td>
                    </tr>

                    <tr>
                        <td>2</td>
                        <td>Amina Yakubu</td>
                        <td>ADM002</td>
                        <td>KG 2</td>
                        <td>
                            <span class="badge pending">Pending</span>
                        </td>
                        <td>
                            <button class="btn-view">View</button>
                        </td>
                    </tr>

                    <tr>
                        <td>3</td>
                        <td>Mohammed Issah</td>
                        <td>ADM003</td>
                        <td>JHS 1</td>
                        <td>
                            <span class="badge rejected">Rejected</span>
                        </td>
                        <td>
                            <button class="btn-view">View</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </body>
</html>
