<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Class Splash Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/v4-shims.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
</head>
<body>
    <div class="background-shapes" aria-hidden="true">
        <div class="shape shape-a"></div>
        <div class="shape shape-b"></div>
    </div>

    <main class="splash-center">
        <div style="background: green; height: 300px; width: 500px;">
            <button style="background: red; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">
                <i id="myi-style" class="fa fa-recycle"></i>
                DELETE
            </button>
        </div>
    </main>
</body>
</html>
