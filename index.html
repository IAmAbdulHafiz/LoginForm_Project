<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="login-container">
        <div class="left-container">
            <h1>Grading System</h1>
            <p>Students Result Management Portal</p>

            <div class="features">
                <ul>
                    <li>Secure Login</li>
                    <li>Fast Result Access</li>
                    <li>Student-Friendly Interface</li>
                </ul>

            </div>
            <p class="year">2025/2026 Academic Year</p>
        </div>


        <div class="right-container">
            <h2>Welcome Back!</h2>
            <p>Log in to your portal...</p>

            <form class="form-card">
                <div class="info">
                    <label for="name">Username or Email</label>
                    <input type="text" id="name" placeholder="Enter email or username" required>
                </div>

                <div class="info">
                    <label for="password">Password</label>
                    <input type="password" placeholder="Enter password" id="password" required>
                </div>

                <button type="submit">Login</button>

            </form>

        </div>

    </div>
</body>
</html>
