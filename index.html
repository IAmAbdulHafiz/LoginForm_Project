<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Grading System — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    </head>
<body>
    <main class="layout-center">
        <div class="card card-rid card-grid">
            <section class="left-panel">
                <div class="brand large">
                    <h1>Grading <span>System</span></h1>
                    <p class="subtitle">Secure portal for Students & Teachers</p>
                </div>
                <div class="left-illustration">
                    <img src="images/grades-illustration.svg" alt="Grades illustration" aria-hidden="true">
                </div>
                <p class="left-note">Fast, secure grading and reporting. Sign in to continue to your dashboard.</p>
            </section>

            <section class="right-panel">
                <div class="brand small">
                  <h2>Welcome back</h2>
                  <p class="subtitle">Sign in to access your account</p>
                </div>

                <form class="login-form" action="#" novalidate>
                    <div class="field">
                        <label for="user">Username or Email</label>
                        <input id="user" name="user" type="text" autocomplete="username" required>
                    </div>

                    <div class="field">
                        <label for="pass">Password</label>
                        <input id="pass" name="pass" type="password" autocomplete="current-password" required>
                    </div>

                    <div class="row">
                        <div class="field small">
                            <label for="role">Role</label>
                            <select id="role" name="role">
                                <option>Student</option>
                                <option>Teacher</option>
                                <option>Admin</option>
                            </select>
                        </div>

                        <div class="field small remember">
                            <label for="remember"><input id="remember" type="checkbox" name="remember"> Remember</label>
                        </div>
                    </div>

                    <button class="btn primary" type="submit">Sign In</button>

                    <div class="extras">
                        <a href="forget-password.html">Forgot password?</a>
                        <a href="create-account.html">Create account</a>
                    </div>

                </form>

            </section>   

        </div>    
    </main>  
</body>
</html>
